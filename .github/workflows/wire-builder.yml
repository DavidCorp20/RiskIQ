name: Wire low-code builder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire builder
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('frontend/src/App.jsx')
          s=p.read_text(encoding='utf-8')
          if "import Builder from './Builder'" not in s:
              s=s.replace("import {askCopilot,discoverFile,getDatasetHistory,ingestFile,listDatasets,runDataset,runSimulator} from './api'", "import {askCopilot,discoverFile,getDatasetHistory,ingestFile,listDatasets,runDataset,runSimulator} from './api'\nimport Builder from './Builder'")
          s=s.replace("import './visual-system.css'", "import './visual-system.css'\nimport './builder.css'")
          s=s.replace("<Builder onRun={execute}/>", "<Builder/>")
          s=re.sub(r"function Builder\\(\\{onRun\\}\\)\\{.*?\\}\\nfunction Scenario", "function Scenario", s, flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/wire-builder.yml
      - name: Commit generated wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx frontend/src/Builder.jsx frontend/src/builder.css .github/workflows/wire-builder.yml
          git commit -m 'feat(ui): activate functional low-code decision builder' || exit 0
          git push
