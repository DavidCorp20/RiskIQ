name: Rename legacy builder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/src/App.jsx')
          s=p.read_text(encoding='utf-8')
          old='function Builder({onRun})'
          new='function LegacyBuilder({onRun})'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
      - run: rm .github/workflows/fix-builder-name-2.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx .github/workflows/fix-builder-name-2.yml
          git commit -m 'fix(ui): rename legacy builder symbol' || exit 0
          git push
