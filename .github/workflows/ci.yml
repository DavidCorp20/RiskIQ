name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      MONGO_DB: riskiq_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start MongoDB
        working-directory: .
        run: |
          docker run -d --name riskiq-mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            if docker exec riskiq-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker logs riskiq-mongo
          exit 1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
